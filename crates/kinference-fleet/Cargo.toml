[package]
name = "kinference-fleet"
description = "Which workers exist and what state they are in: pools, discovery, the scrape of engine metrics, ZMQ ingest and the model index"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Fixtures for other crates' tests.
test-util = []

[dependencies]
kinference-policy.workspace = true
dynamo-kv-events.workspace = true
dynamo-kv-hashing.workspace = true
dynamo-kv-indexer.workspace = true
dynamo-router-protocol.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util.workspace = true
serde.workspace = true
omq-tokio.workspace = true
tracing.workspace = true
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
dashmap.workspace = true
prometheus-parse.workspace = true
prometheus.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
kinference-policy = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
